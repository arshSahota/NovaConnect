<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaConnect Support Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <h1>NovaConnect Support Portal</h1>
    <p>Welcome to NovaConnect Customer Support.</p>
    <p>Please enter your information and select the type of support you need.</p>
    <hr>

    <form method="POST">

        <label for="name">Customer Name:</label>
        <br>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="account">Account Number:</label>
        <br>
        <input type="text" id="account" name="account">
        <br><br>

        <label for="support_type">Support Type:</label>
        <br>
        <select id="support_type" name="support_type">
            <option value="Billing">Billing</option>
            <option value="Internet Support">Internet Support</option>
            <option value="Mobile Support">Mobile Support</option>
        </select>

        <br><br>

        <button type="submit">Submit Request</button>
    </form>
</body>
</html>
